<!doctype html>
<!-- Source of og.png (the link preview). Re-shoot with: node tools/shoot-og.mjs (from the repo root) -->
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500..800&family=Geist+Mono:wght@500..700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(120% 120% at 0% 0%,#ffffff 0%,#f1f5f6 45%,#dfe9eb 100%);font-family:'Geist','PingFang TC','Noto Sans TC',sans-serif;color:#111a1f;position:relative}
.txt{position:absolute;left:72px;top:96px;width:520px}
.logo{font:700 76px 'Geist Mono',monospace;letter-spacing:-.04em}
.logo span{color:#0d5f74}
h1{font-size:46px;line-height:1.25;margin:36px 0 0;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:#0d5f74}
p{font-size:24px;color:#36444b;margin:24px 0 0;line-height:1.5}
.url{position:absolute;left:72px;bottom:54px;font:500 20px 'Geist Mono',monospace;color:#5b6a71}
.shot{position:absolute;left:640px;top:70px;width:820px;border-radius:18px;box-shadow:0 40px 80px -30px rgb(15 26 29/.5);transform:perspective(1800px) rotateY(-16deg) rotateX(6deg) rotateZ(1deg);transform-origin:0 50%}
</style></head><body>
<div class="txt">
  <div class="logo">slide<span>jam</span></div>
  <h1>會<em>動</em>的簡報，<br>跟 AI 一起 jam 出來</h1>
  <p>一個 HTML 檔，雙擊就開。<br>真網站拍進投影片，45 種效果。</p>
</div>
<div class="url">slidejam.pages.dev</div>
<img class="shot" src="og-bento.png" alt="">
